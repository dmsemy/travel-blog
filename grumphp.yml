parameters:
  stop_on_failure: false
  parallel: 
    enabled: true

  git_hooks:
    pre-commit: pre_commit
    commit-msg: commit_message
    pre-push: pre_push

  testsuites:
    default:
      tasks:
        - phpcsfixer
        - phpcs
        - shell
        - phpstan
        - phpmd
    commit_message:
      tasks:
        - git_commit_message
    pre_commit:
      tasks:
        - phpcsfixer
        - phpcs
        - shell
    pre_push:
      tasks:
        - phpstan
        - phpmd
        - shell

  tasks:
    git_commit_message:
      allow_empty_message: false
      enforce_capitalized_subject: false
      max_subject_width: 72
      matchers:
        Conventional: '/^(feat|fix|chore|docs|refactor|test|style|perf)(\([\w\-]+\))?!?:\s[A-Z].+$/'
      case_insensitive: false

    phpcsfixer:
      config: .php-cs-fixer.dist.php
      diff: true
      verbose: true
      using_cache: false
      triggered_by: [php]

    phpcs:
      standard: phpcs.xml.dist
      triggered_by: [php]

    shell:
      scripts: 
        - bin/validate-symfony-config.sh
      triggered_by: ['php', 'xml', 'yaml', 'yml']

    phpstan:
      configuration: phpstan.dist.neon
      level: max
      memory_limit: 512M
      triggered_by: [php]

    phpmd:
      ruleset: [phpmd.xml.dist]
      triggered_by: [php]
